<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeetCode 150 Picker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>NeetCode 150 Picker</h1>
        <p class="subtitle">Spin for a problem you have not solved yet.</p>
      </header>

      <section class="stats" id="stats" aria-live="polite"></section>

      <section class="wheel-section">
        <div class="wheel-wrap">
          <canvas id="wheel" width="420" height="420" aria-hidden="true"></canvas>
          <div class="wheel-pointer" aria-hidden="true"></div>
        </div>
        <button type="button" id="spin-btn" class="btn btn-primary">Spin the wheel</button>
      </section>

      <section class="result card" id="result" hidden>
        <p class="result-label">Your pick</p>
        <h2 id="result-title"></h2>
        <div class="result-actions">
          <a id="result-neetcode" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Open on NeetCode</a>
          <a id="result-leetcode" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Open on LeetCode</a>
          <button type="button" id="mark-done-btn" class="btn btn-success">Mark as done</button>
          <button type="button" id="mark-undone-btn" class="btn btn-ghost" hidden>Mark as not done (add back to wheel)</button>
        </div>
      </section>

      <section class="lists">
        <details class="card">
          <summary>Remaining (<span id="remaining-count">0</span>)</summary>
          <ul id="remaining-list" class="problem-list"></ul>
        </details>
        <details class="card">
          <summary>Done (<span id="done-count">0</span>)</summary>
          <ul id="done-list" class="problem-list"></ul>
        </details>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
